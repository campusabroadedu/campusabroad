<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedVoyage 2026 — Pre-Departure Orientation | Campus Abroad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0B5FA5;
    --blue-deep:#073E6E;
    --orange:#F26522;
    --gold:#D4A017;
    --paper:#F4F7FB;
    --ink:#141B2B;
    --white:#FFFFFF;
    --muted:#5C6B82;
    --line:#E1E7F0;
    --disp:"Poppins", sans-serif;
    --sans:"Inter", -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); background:var(--ink); color:var(--ink);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}

  /* ---------- Logo badge (every slide) ---------- */
  .logo-badge{
    position:fixed; top:18px; right:22px; z-index:500;
    background:rgba(255,255,255,.94); border-radius:8px; padding:8px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    display:flex; align-items:center;
  }
  .logo-badge img{height:26px; width:auto;}

  /* ---------- Top progress bar ---------- */
  .progress-track{position:fixed; top:0; left:0; right:0; height:4px; background:rgba(255,255,255,.12); z-index:501;}
  .progress-fill{height:100%; background:var(--orange); width:0%; transition:width .25s ease;}

  /* ---------- Section jump menu ---------- */
  .jump{
    position:fixed; top:16px; left:22px; z-index:500;
  }
  .jump select{
    font-family:var(--sans); font-weight:600; font-size:13px; color:var(--white);
    background:rgba(20,27,43,.88); border:1px solid rgba(255,255,255,.18);
    padding:9px 12px; border-radius:8px; cursor:pointer; max-width:46vw;
  }
  .jump select:focus{outline:2px solid var(--orange);}
  .jump option{color:var(--ink);}

  /* ---------- Deck / slides ---------- */
  .deck{position:relative; width:100vw; height:100vh;}
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:100px 9vw 90px; opacity:0; pointer-events:none; transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease; background:var(--paper); overflow-y:auto;
  }
  .slide.active{opacity:1; pointer-events:auto; transform:translateX(0); z-index:2;}

  .kicker{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--disp); font-weight:700;
    font-size:13.5px; letter-spacing:.06em; text-transform:uppercase; padding:7px 16px;
    border-radius:99px; margin-bottom:22px; width:fit-content;
  }
  .kicker .flag{width:9px; height:9px; border-radius:50%;}

  .slide h1{
    font-family:var(--disp); font-weight:700; font-size:clamp(28px,3.6vw,46px); line-height:1.12;
    color:var(--ink); margin-bottom:8px; max-width:22ch;
  }
  .slide .subtitle{font-size:16px; color:var(--muted); max-width:70ch; margin-bottom:22px; font-weight:500;}

  .content-grid{display:grid; grid-template-columns:1fr; gap:14px; max-width:900px;}
  .content-grid.two-col{grid-template-columns:1fr 1fr; gap:16px 40px;}

  .bullet{
    display:flex; align-items:flex-start; gap:14px; font-size:16.5px; color:var(--ink);
    font-weight:500; line-height:1.5;
  }
  .bullet .dot{
    flex:none; width:9px; height:9px; border-radius:50%; margin-top:8px; background:var(--dot-color, var(--blue));
  }
  .bullet b{font-weight:700;}
  .bullet-note{font-size:14px; color:var(--muted); margin-top:3px; font-weight:400;}

  .callout{
    margin-top:24px; padding:16px 20px; border-radius:10px; background:var(--white);
    border:1px solid var(--line); font-size:15px; font-weight:600; max-width:720px;
    display:flex; align-items:center; gap:12px;
  }
  .callout.warn{background:#FFF3E9; border-color:#FCD9BC; color:#9A4A16;}

  .list-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; max-width:920px;}
  .list-card{
    background:var(--white); border:1px solid var(--line); border-radius:12px; padding:18px 20px;
    font-family:var(--disp); font-weight:600; font-size:16px; color:var(--ink);
  }
  .list-card span{display:block; font-family:var(--sans); font-weight:500; font-size:13.5px; color:var(--muted); margin-top:5px;}

  .slide-counter{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:500;
    font-family:var(--disp); font-weight:600; font-size:13px; color:rgba(255,255,255,.92);
    background:rgba(20,27,43,.82); padding:7px 16px; border-radius:99px;
  }

  .nav-btn{
    position:fixed; top:50%; transform:translateY(-50%); z-index:500;
    width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(20,27,43,.72); color:var(--white); font-size:20px;
    display:flex; align-items:center; justify-content:center; transition:background .15s ease;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .nav-btn:hover{background:rgba(20,27,43,.9);}
  .nav-btn.prev{left:18px;}
  .nav-btn.next{right:18px;}
  .nav-btn:disabled{opacity:.25; cursor:default;}

  /* ---------- Cover slide ---------- */
  .cover{
    background:linear-gradient(155deg, var(--blue-deep) 0%, var(--blue) 55%, #0A4A85 100%);
    align-items:center; text-align:center; padding-top:60px;
  }
  .cover .cover-logo{width:min(280px,60vw); margin-bottom:26px;}
  .cover .tagline{
    font-family:'Poppins', cursive; font-style:italic; font-weight:500; color:rgba(255,255,255,.85);
    font-size:16px; margin-bottom:30px;
  }
  .cover h1.big-title{
    font-family:var(--disp); font-weight:800; font-size:clamp(44px,8vw,90px); line-height:.98;
    background:linear-gradient(180deg, var(--gold) 0%, #FFE9A8 45%, var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-transform:uppercase; max-width:none; margin:0;
  }
  .cover h2.year{
    font-family:var(--disp); font-weight:800; font-size:clamp(52px,10vw,110px); line-height:.9;
    color:var(--white); margin:6px 0 30px;
  }
  .cover .pill{
    background:#C8102E; color:var(--white); font-family:var(--disp); font-weight:700;
    font-size:clamp(14px,2vw,20px); padding:14px 34px; border-radius:99px; letter-spacing:.03em;
    margin-bottom:26px;
  }
  .cover .site{color:rgba(255,255,255,.7); font-size:14px; font-weight:500;}

  /* ---------- Section-color divider slide ---------- */
  .divider{align-items:center; text-align:center;}
  .divider h1{font-size:clamp(36px,5.6vw,62px); max-width:none; color:var(--white);}
  .divider .sub{color:rgba(255,255,255,.78); font-size:17px; max-width:60ch;}
  .divider .divider-list{
    margin-top:34px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:820px;
  }
  .divider .divider-list span{
    background:rgba(255,255,255,.14); color:var(--white); font-weight:600; font-size:14.5px;
    padding:10px 20px; border-radius:99px;
  }

  /* ---------- Thank you slide ---------- */
  .thanks{
    background:linear-gradient(155deg, var(--blue-deep) 0%, var(--blue) 100%);
    align-items:center; text-align:center;
  }
  .thanks h1{color:var(--white); font-size:clamp(38px,6vw,64px); max-width:none;}
  .thanks .sub{color:rgba(255,255,255,.85); font-size:17px; max-width:60ch; margin-bottom:8px;}
  .contact-card{
    margin-top:28px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    border-radius:14px; padding:24px 34px; color:var(--white); max-width:560px;
  }
  .contact-card .row{display:flex; justify-content:space-between; font-size:15.5px; padding:6px 0; font-weight:500;}
  .contact-card .row b{font-weight:700;}

  @media (max-width:760px){
    .slide{padding:96px 6vw 70px;}
    .content-grid.two-col{grid-template-columns:1fr;}
    .nav-btn{width:38px; height:38px; font-size:16px;}
    .jump select{max-width:56vw; font-size:12px;}
  }
</style>
</head>

// ---------- Renderer ----------
const deck = document.getElementById('deck');
let current = 0;

function bulletsHTML(items, color, twoCol){
  const cls = twoCol ? 'content-grid two-col' : 'content-grid';
  return `<div class="${cls}">` + items.map(it => {
    if (typeof it === 'string'){
      return `<div class="bullet"><span class="dot" style="--dot-color:${color}"></span><span>${it}</span></div>`;
    } else {
      return `<div class="bullet"><span class="dot" style="--dot-color:${color}"></span><span><b>${it.b}</b>${it.n ? `<div class="bullet-note">${it.n}</div>` : ''}</span></div>`;
    }
  }).join('') + '</div>';
}

function cardsHTML(items){
  return `<div class="list-cards">` + items.map(it => {
    if (typeof it === 'string') return `<div class="list-card">${it}</div>`;
    return `<div class="list-card">${it.t}<span>${it.s}</span></div>`;
  }).join('') + '</div>';
}

function renderSlide(s, i){
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.index = i;

  if (s.type === 'cover'){
    el.classList.add('cover');
    el.innerHTML = `
      <img class="cover-logo" src="${LOGO}" alt="Campus Abroad">
      <div class="tagline">${s.tagline}</div>
      <h1 class="big-title">${s.title}</h1>
      <h2 class="year">${s.year}</h2>
      <div class="pill">${s.pill}</div>
      <div class="site">${s.site}</div>
    `;
  } else if (s.type === 'divider'){
    el.classList.add('divider');
    el.style.background = s.bg;
    el.innerHTML = `
      <span class="kicker" style="background:rgba(255,255,255,.16); color:#fff;"><span class="flag" style="background:${s.dot}"></span>${s.kicker}</span>
      <h1>${s.title}</h1>
      ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
      ${s.list ? `<div class="divider-list">${s.list.map(x=>`<span>${x}</span>`).join('')}</div>` : ''}
    `;
  } else if (s.type === 'thanks'){
    el.classList.add('thanks');
    el.innerHTML = `
      <h1>${s.title}</h1>
      <div class="sub">${s.sub}</div>
      <div class="contact-card">
        ${s.contacts.map(c => `<div class="row"><span>${c.k}</span><b>${c.v}</b></div>`).join('')}
      </div>
    `;
  } else {
    el.innerHTML = `
      <span class="kicker" style="background:${s.kickerBg}; color:${s.kickerText};"><span class="flag" style="background:${s.dot}"></span>${s.kicker}</span>
      <h1>${s.title}</h1>
      ${s.subtitle ? `<div class="subtitle">${s.subtitle}</div>` : ''}
      ${s.bullets ? bulletsHTML(s.bullets, s.dot, s.twoCol) : ''}
      ${s.cards ? cardsHTML(s.cards) : ''}
      ${s.callout ? `<div class="callout ${s.calloutWarn ? 'warn' : ''}">${s.callout}</div>` : ''}
    `;
  }
  return el;
}

function buildDeck(){
  slides.forEach((s, i) => deck.appendChild(renderSlide(s, i)));
  buildJump();
  goTo(0);
}

function buildJump(){
  const sel = document.getElementById('jumpSelect');
  slides.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${i+1}. ${s.navLabel || s.title.replace(/<[^>]+>/g,'')}`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => goTo(parseInt(e.target.value)));
}

function goTo(i){
  if (i < 0 || i >= slides.length) return;
  const prevEl = deck.querySelector('.slide.active');
  if (prevEl) prevEl.classList.remove('active');
  current = i;
  deck.children[i].classList.add('active');
  document.getElementById('slideCounter').textContent = `${i+1} / ${slides.length}`;
  document.getElementById('progressFill').style.width = `${((i+1)/slides.length)*100}%`;
  document.getElementById('jumpSelect').value = i;
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').disabled = i === slides.length - 1;
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

let touchStartX = null;
deck.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
deck.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 60) goTo(current - 1);
  if (dx < -60) goTo(current + 1);
  touchStartX = null;
});

buildDeck();
</script>
